name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  source-demo:
    name: Build and publish source demo
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    env:
      DEMO_VERSION: ${{ needs.release-please.outputs.version }}
      RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: loonghao/vx@6948178844826716e636b474ab322dd8dc115578
        with:
          version: '0.9.35'
          tools: node@22 uv just gh
      - run: vx just install
      - run: vx just check
      - run: vx just package "$DEMO_VERSION"
      - run: vx just verify-package "dist/maya-outliner-$DEMO_VERSION.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: maya-outliner-source-demo
          path: dist/maya-outliner-*.zip
          retention-days: 90
      - name: Publish verified source archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: vx gh release upload "$RELEASE_TAG" "dist/maya-outliner-$DEMO_VERSION.zip" --clobber
