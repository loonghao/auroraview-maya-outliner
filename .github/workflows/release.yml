name: Release

# This workflow handles automated releases using release-please
# It creates releases when changes are pushed to main, and publishes packages to GitHub Releases

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write # Required for creating releases and uploading artifacts
  pull-requests: write # Required for release-please
  issues: write # Required for release-please

jobs:
  # First job: Run release-please to create releases and tags
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}

    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Build and package (only if release was created)
  build-package:
    name: Build Maya Outliner Package
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Maya package
        run: |
          VERSION="${{ needs.release-please.outputs.version }}"
          echo "Building package version: $VERSION"
          python build_maya_package.py --version "$VERSION"

      - name: Verify package
        run: |
          VERSION="${{ needs.release-please.outputs.version }}"
          PACKAGE_FILE="dist/maya-outliner-${VERSION}.zip"

          if [ ! -f "$PACKAGE_FILE" ]; then
            echo "❌ Package not found: $PACKAGE_FILE"
            exit 1
          fi

          echo "✅ Package created: $PACKAGE_FILE"
          ls -lh "$PACKAGE_FILE"

          # Show package contents
          echo ""
          echo "Package contents:"
          unzip -l "$PACKAGE_FILE"

      - name: Upload package artifact
        uses: actions/upload-artifact@v5
        with:
          name: maya-outliner-package
          path: dist/maya-outliner-*.zip
          retention-days: 90

  # Create GitHub Release with package
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [release-please, build-package]
    if: ${{ needs.release-please.outputs.release_created }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download package artifact
        uses: actions/download-artifact@v6
        with:
          name: maya-outliner-package
          path: release-artifacts

      - name: Generate changelog
        id: changelog
        uses: jaywcjlove/changelog-generator@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filter-author: (loonghao|renovate\\[bot\\]|dependabot\\[bot\\]|Renovate Bot)
          filter: ''
          template: |
            ## 🐛 Bug Fixes
            {{fix}}

            ## ✨ Features
            {{feat}}

            ## 🔧 Improvements
            {{refactor,perf,clean}}

            ## 📝 Documentation
            {{docs}}

            ## 🔨 Miscellaneous
            {{chore,style,ci,build||🔧 Nothing changed}}

            ## 🔍 Unknown
            {{__unknown__}}

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "release-artifacts/*"
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.release-please.outputs.tag_name }}
          name: ${{ needs.release-please.outputs.tag_name }}
          body: |
            # AuroraView Maya Outliner ${{ needs.release-please.outputs.tag_name }}

            ## 📦 Installation

            1. Download `maya-outliner-${{ needs.release-please.outputs.version }}.zip`
            2. Extract the zip file
            3. Run `install.bat` (Windows) or `install.ps1` (PowerShell)
            4. Restart Maya
            5. Launch the outliner:
               ```python
               from auroraview_maya_outliner import main
               main()
               ```

            Or copy `userSetup.py` to your Maya scripts folder for auto-load.

            ## 📋 What's Changed

            Comparing Changes: ${{ steps.changelog.outputs.compareurl }}

            ${{ steps.changelog.outputs.changelog }}

            ## 📚 Documentation

            - [Installation Guide](https://github.com/loonghao/auroraview-maya-outliner/blob/main/INSTALLATION.md)
            - [Build Package Guide](https://github.com/loonghao/auroraview-maya-outliner/blob/main/BUILD_PACKAGE.md)
          draft: false
          prerelease: false
          allowUpdates: true
          skipIfReleaseExists: false
          updateOnlyUnreleased: false

